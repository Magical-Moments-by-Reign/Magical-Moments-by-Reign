# ── Netlify configuration ───────────────────────────────────────
# Magical by Reign is a Next.js (App Router) app and MUST be served by
# Netlify's official Next.js Runtime (@netlify/plugin-nextjs). The
# runtime turns the build into serverless functions + assets and owns
# routing (including "/").
#
# Why the explicit [[plugins]] block: the site was originally created as
# a manual/static deploy, so its dashboard had a publish directory that
# broke auto-detection — Netlify was statically serving the raw `.next`
# folder (which has no root index.html) and returning a generic 404 at
# "/". Declaring the runtime forces it to run and take over publishing.
#
# The runtime manages/overrides the publish directory itself; `publish`
# below only exists to satisfy the runtime's check that publish != base
# (both would otherwise resolve to the repo root).
#
# Required environment variables (Netlify → Site settings → Environment
# variables) — see DEPLOY.md:
#   DATABASE_URL          Postgres connection string (Supabase Session pooler)
#   SOCIAL_TOKEN_KEY      openssl rand -hex 32
#   NEXT_PUBLIC_BASE_URL  your live URL (e.g. https://magical-m.netlify.app)

[build]
  # Ordinary deploys (design, content, application code) run ONLY:
  #   prisma generate && next build
  # They do NOT touch the database — no `prisma db push` — so a build can never
  # exhaust the Supabase Session pooler (EMAXCONNSESSION). Schema changes are
  # applied deliberately and separately with `npm run db:deploy` (which sets
  # RUN_DATABASE_PUSH=true). See scripts/prepare-db.mjs and DEPLOY.md.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  NPM_FLAGS = "--no-audit --no-fund"

# Netlify's official Next.js runtime. Declared explicitly so it always
# engages (do not remove — without it Netlify serves .next statically
# and "/" 404s).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Production schema deploy (deliberate only) ──────────────────
# A dedicated branch — NOT the production branch, NOT touched by any
# ordinary deploy, PR preview, or push to main — whose build applies the
# Prisma schema (npm run db:deploy) before building. This is the ONLY
# context where that command runs; every other deploy still resolves to
# the [build] block above and never touches the database.
#
# To apply a pending schema change to production, once you've merged the
# code change to main:
#   1. Fast-forward the "db-schema-deploy" branch to the latest main and
#      push it (or, one-time only, create it: `git checkout -b
#      db-schema-deploy && git push -u origin db-schema-deploy`).
#   2. In Netlify: Deploys -> Trigger deploy -> Deploy branch ->
#      db-schema-deploy. (If Netlify already auto-builds every pushed
#      branch, pushing step 1 alone is enough.)
#   3. Watch that deploy's log for scripts/prepare-db.mjs's own output —
#      it reports exactly what it did, and DATABASE_URL's value is never
#      printed. See DEPLOY.md for verifying success and recovery steps.
#
# This reuses whatever DATABASE_URL is already configured for this site —
# no new credential to add. If DATABASE_URL's environment-variable scope in
# Netlify is restricted to "Production" only, this branch deploy won't see
# it; prepare-db.mjs detects that and safely no-ops rather than failing
# destructively (see scripts/prepare-db.mjs) — if that happens, add
# "Branch deploys" to DATABASE_URL's deploy contexts in Netlify -> Site
# configuration -> Environment variables.
[context.db-schema-deploy]
  command = "npm run db:deploy && npm run build"
