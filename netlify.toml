# ── Netlify configuration ───────────────────────────────────────
# Magical by Reign is a Next.js (App Router) app and MUST be served by
# Netlify's official Next.js Runtime (@netlify/plugin-nextjs). The
# runtime turns the build into serverless functions + assets and owns
# routing (including "/").
#
# Why the explicit [[plugins]] block: the site was originally created as
# a manual/static deploy, so its dashboard had a publish directory that
# broke auto-detection — Netlify was statically serving the raw `.next`
# folder (which has no root index.html) and returning a generic 404 at
# "/". Declaring the runtime forces it to run and take over publishing.
#
# The runtime manages/overrides the publish directory itself; `publish`
# below only exists to satisfy the runtime's check that publish != base
# (both would otherwise resolve to the repo root).
#
# Required environment variables (Netlify → Site settings → Environment
# variables) — see DEPLOY.md:
#   DATABASE_URL          Postgres connection string (Supabase Session pooler)
#   SOCIAL_TOKEN_KEY      openssl rand -hex 32
#   NEXT_PUBLIC_BASE_URL  your live URL (e.g. https://magical-m.netlify.app)

[build]
  # Every deploy — production, PR previews, everything — runs this SAME
  # command. scripts/prepare-db.mjs itself decides whether to touch the
  # database: it checks RUN_DATABASE_PUSH and immediately no-ops (exit 0,
  # one log line, `next build` proceeds normally) unless that variable is
  # exactly "true". Since RUN_DATABASE_PUSH is NOT set in this site's
  # environment variables by default, every ordinary deploy behaves
  # identically to the old "prisma generate && next build" — no build-time
  # database connection, so a build can never exhaust the Supabase Session
  # pooler (EMAXCONNSESSION).
  #
  # This replaced an earlier attempt at a separate "db-schema-deploy"
  # branch/context — that relied on correctly selecting that branch in
  # Netlify's "Trigger deploy" UI, which is easy to mis-click (a plain
  # "Trigger deploy" redeploys the production branch instead). This
  # mechanism instead reuses the exact same "Trigger deploy" button that
  # already works, gated by one environment-variable toggle — see
  # "Deploying a schema change to production" in DEPLOY.md.
  command = "prisma generate && node scripts/prepare-db.mjs && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  NPM_FLAGS = "--no-audit --no-fund"

# Netlify's official Next.js runtime. Declared explicitly so it always
# engages (do not remove — without it Netlify serves .next statically
# and "/" 404s).
[[plugins]]
  package = "@netlify/plugin-nextjs"
